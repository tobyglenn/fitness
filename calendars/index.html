<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>📅 Fitness Calendars</title>
  
    <style>
      :root{--bg:#0d1117;--card:#161b22;--line:#30363d;--text:#fff;--muted:#8b949e;--accent:#f39c12;--blue:#58a6ff;--green:#2ea043;--good:#2ea043;--mid:#d29922;--poor:#f85149}
      *{box-sizing:border-box}
      body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text)}
      .global-nav{position:sticky;top:0;z-index:20;background:#0b0f14;border-bottom:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;padding:10px 16px}
      .global-nav a{color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:8px;font-size:.9rem}
      .global-nav a.active,.global-nav a:hover{color:var(--accent);background:#161b22}
      .container{max-width:1200px;margin:0 auto;padding:18px}
      .header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
      .header h1{margin:0;font-size:2rem;color:var(--accent)}
      .summary{background:var(--card);border:1px solid var(--line);padding:14px;border-radius:10px;margin-bottom:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
      .summary .box{background:#0b0f14;padding:10px;border-radius:8px;border:1px solid #21262d}
      .summary .label{color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.04em}
      .summary .value{font-size:1.45rem;font-weight:700;margin-top:6px}
      .calendar-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
      .month-title{font-size:1.5rem;margin:0 0 10px}
      .meta{color:var(--muted);font-size:.9rem;margin-bottom:12px}
      .pager{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px;flex-wrap:wrap}
      .pager a{color:var(--blue);text-decoration:none;padding:6px 10px;border:1px solid var(--line);border-radius:8px}
      .grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
      .dow{font-size:.75rem;color:var(--muted);text-align:center;padding:8px 0}
      .day{position:relative;min-height:88px;background:#0b0f14;border:1px solid #21262d;border-radius:8px;padding:8px 8px 6px}
      .day.empty{opacity:0.85}
      .day.future{opacity:0.45}
      .day.today{outline:2px solid var(--accent);outline-offset:-2px}
      .day.weekend{background:#111826}
      .day .num{font-weight:700;font-size:.9rem}
      .tone{margin-top:6px;color:var(--accent);font-size:.76rem;line-height:1.25}
      .gar{margin-top:6px;color:var(--green);font-size:.76rem;line-height:1.25}
      .reco{margin-top:6px;font-size:.74rem}
      .reco .dot{display:inline-block;width:9px;height:9px;border-radius:99px;margin-right:6px;vertical-align:middle}
      .whoop-good .dot{background:var(--good)}
      .whoop-mid .dot{background:var(--mid)}
      .whoop-poor .dot{background:var(--poor)}
      .whoop{display:flex;align-items:center;margin-top:6px;font-size:.75rem;color:var(--muted)}
      .footer{margin-top:20px;color:var(--muted);font-size:.88rem}
      .month-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:12px}
      .month-grid a{color:var(--blue);text-decoration:none;background:#0b0f14;border:1px solid var(--line);border-radius:8px;padding:9px}
      .month-grid a.current{border-color:var(--accent);color:var(--accent)}
    </style>
    
  <style>.month-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));} .calendar-card{padding-bottom:22px}</style>
</head>
<body>

</body>
