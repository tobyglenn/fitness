    <title>Clawd Strength & Recovery Report - Final</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #020202; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        .header { text-align: left; margin-bottom: 40px; border-left: 5px solid #00ff88; padding-left: 20px; }
        h1 { color: #fff; margin: 0; font-size: 3em; letter-spacing: -2px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .card { background: #0a0a0a; border-radius: 20px; padding: 30px; border: 1px solid #1a1a1a; transition: transform 0.2s; }
        .card:hover { border-color: #333; }
        .card h3 { margin-top: 0; color: #555; text-transform: uppercase; font-size: 0.8em; letter-spacing: 2px; margin-bottom: 20px; }
        .stat-value { font-size: 3.5em; font-weight: 800; color: #fff; line-height: 1; }
        .stat-label { color: #00ff88; text-transform: uppercase; font-size: 0.7em; letter-spacing: 1px; font-weight: bold; }
        .body-viz { text-align: center; grid-column: span 2; display: grid; grid-template-columns: 1fr 1fr; align-items: center; }
        @media (max-width: 800px) { .body-viz { grid-template-columns: 1fr; } .body-viz svg { order: -1; } }
        svg { max-width: 280px; filter: drop-shadow(0 0 15px rgba(0,255,136,0.1)); }
        .volume-bar { height: 6px; background: #111; border-radius: 3px; margin-top: 8px; overflow: hidden; }
        .volume-fill { height: 100%; background: #00ff88; }
        .muscle-label { display: flex; justify-content: space-between; margin-top: 20px; font-size: 0.85em; color: #aaa; }
        .muscle-label b { color: #fff; }
        .chart-container { height: 200px; margin-top: 20px; }
        .prediction-item { margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #111; }
        .prediction-item .time { color: #00ff88; font-weight: bold; font-size: 0.9em; }
        .prediction-item .part { font-size: 0.8em; color: #555; text-transform: uppercase; }
        .tag { background: #111; padding: 4px 10px; border-radius: 20px; font-size: 0.7em; color: #00ff88; border: 1px solid #222; margin-right: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <span class="stat-label">ATHLETE INTELLIGENCE</span>
            <h1>PERFORMANCE REPORT</h1>
            <p id="date-updated" style="color: #444; font-size: 0.8em;"></p>
        </div>

        <div class="grid">
            <!-- Hero Recovery Section -->
            <div class="card body-viz">
                <div style="text-align: left;">
                    <h3>Biological Readiness</h3>
                    <div style="margin-bottom: 30px;">
                        <span class="stat-label">Systemic Recovery</span><br>
                        <span class="stat-value" id="whoop-score">--</span><span style="font-size: 0.5em; color: #333;">%</span>
                    </div>
                    <div id="prediction-list"></div>
                </div>
                <div>
                    <svg viewBox="0 0 200 400" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <filter id="glow">
                                <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
                                <feMerge>
                                    <feMergeNode in="coloredBlur"/>
                                    <feMergeNode in="SourceGraphic"/>
                                </feMerge>
                            </filter>
                        </defs>
                        <circle cx="100" cy="40" r="25" fill="#111" id="part-Core" />
                        <rect x="70" y="70" width="60" height="100" rx="10" fill="#111" id="part-Chest" />
                        <rect x="40" y="70" width="25" height="120" rx="10" fill="#111" id="part-Arms-L" />
                        <rect x="135" y="70" width="25" height="120" rx="10" fill="#111" id="part-Arms-R" />
                        <rect x="72" y="175" width="25" height="150" rx="10" fill="#111" id="part-Legs-L" />
                        <rect x="103" y="175" width="25" height="150" rx="10" fill="#111" id="part-Legs-R" />
                    </svg>
                </div>
            </div>

            <!-- Volume Section -->
            <div class="card">
                <h3>Load Distribution <span id="volume-range" style="font-size: 0.7em; color: #444; font-weight: normal; margin-left: 5px; text-transform: none;"></span></h3>
                <div id="volume-list"></div>
            </div>

            <!-- Overload Tracking -->
            <div class="card" style="grid-column: span 2;">
                <h3>Overload Velocity</h3>
                <div class="chart-container" style="height: 300px;">
                    <canvas id="overloadChart"></canvas>
                </div>
            </div>

            <!-- Nutrition Correlation -->
            <div class="card">
                <h3>Anabolic Support</h3>
                <div style="display: flex; gap: 20px; margin-bottom: 20px;">
                    <div>
                        <span class="stat-label">Energy</span><br>
                        <span class="stat-value" id="nut-kcal" style="font-size: 2em;">--</span>
                    </div>
                    <div>
                        <span class="stat-label">Protein</span><br>
                        <span class="stat-value" id="nut-protein" style="font-size: 2em;">--</span>
                    </div>
                </div>
                <div class="chart-container" style="height: 150px;">
                    <canvas id="volumeTrendChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        const data = @@REPORT_DATA_PLACEHOLDER@@;
        
        document.getElementById('date-updated').innerText = `TS: ${data.last_updated} | V3.0-FINAL`;
        document.getElementById('whoop-score').innerText = data.whoop_global || '--';

        // Set Load Distribution Date Range
        const allVolDates = Object.keys(data.daily_vol).filter(d => Object.values(data.daily_vol[d]).some(v => v > 0)).sort();
        if (allVolDates.length > 0) {
            const start = new Date(allVolDates[0] + 'T12:00:00').toLocaleDateString('en-US', {month: 'short', day: 'numeric'});
            const end = new Date(allVolDates[allVolDates.length - 1] + 'T12:00:00').toLocaleDateString('en-US', {month: 'short', day: 'numeric'});
            document.getElementById('volume-range').innerText = `(${start} - ${end})`;
        }

        // Predictions
        const predList = document.getElementById('prediction-list');
        for (const [part, msg] of Object.entries(data.predicted)) {
            if (msg.includes('Fully')) continue;
            predList.innerHTML += `
                <div class="prediction-item">
                    <div class="part">${part}</div>
                    <div class="time">${msg}</div>
                </div>
            `;
        }

        // Volume List & Body Color
        const volumeList = document.getElementById('volume-list');
        const maxVol = Math.max(...Object.values(data.volume));
        
        // Calculate last trained dates
        const lastTrained = {};
        Object.keys(data.volume).forEach(part => {
            const dates = Object.keys(data.daily_vol)
                .filter(d => data.daily_vol[d][part] > 0)
                .sort();
            lastTrained[part] = dates.length > 0 ? dates[dates.length - 1] : 'Never';
        });

        // Apply individual muscle recovery color to body parts
        const bodyPartRecovery = data.recovery || {}; // Use per-muscle recovery
        
        const allBodyPartIds = ['part-Core', 'part-Chest', 'part-Arms-L', 'part-Arms-R', 'part-Legs-L', 'part-Legs-R', 'part-Back', 'part-Shoulders'];
        allBodyPartIds.forEach(id => {
            const el = document.getElementById(id);
            if (el) {
                let muscleName = id.replace('part-', '').replace('-L', '').replace('-R', ''); // Extract muscle name
                let recoveryScore = bodyPartRecovery[muscleName] || 100; // Default to 100 if not found
                
                let partColor = '#00ff88'; // Green
                if (recoveryScore < 40) partColor = '#ff4444'; // Red
                else if (recoveryScore < 70) partColor = '#ffbb00'; // Yellow
                
                el.style.fill = partColor;
                if (recoveryScore < 100) el.setAttribute('filter', 'url(#glow)');
            }
        });

        for (const [part, vol] of Object.entries(data.volume)) {
            if (vol === 0) continue;
            const percentage = (vol / maxVol) * 100;
            const date = lastTrained[part];
            const dateDisplay = date !== 'Never' ? new Date(date + 'T12:00:00').toLocaleDateString('en-US', {month: 'short', day: 'numeric'}) : 'N/A';

            volumeList.innerHTML += `
                <div class="muscle-label">
                    <span>${part} <span style="font-size: 0.8em; color: #444; margin-left: 8px;">Last: ${dateDisplay}</span></span>
                    <span><b>${vol.toLocaleString()}</b> lbs</span>
                </div>
                <div class="volume-bar">
                    <div class="volume-fill" style="width: ${percentage}%"></div>
                </div>
            `;
        }

        // Overload Chart
        const overloadCtx = document.getElementById('overloadChart').getContext('2d');
        const overloadBadges = document.getElementById('overload-badges');
        
        // 1. Unified X-Axis: Collect and sort all unique dates
        const allDates = new Set();
        Object.values(data.overload).forEach(exData => {
            exData.forEach(d => allDates.add(d.date));
        });
        const sortedLabels = Array.from(allDates).sort();

        // 2. Expand Scope: Top 5 exercises
        const exerciseNames = Object.keys(data.overload).slice(0, 5);
        const colors = ['#00ff88', '#00ccff', '#ff00ff', '#ffff00', '#ff8800'];
        
        const datasets = exerciseNames.map((ex, i) => {
            // Map data to the unified labels array (null for missing dates)
            const chartData = sortedLabels.map(date => {
                const found = data.overload[ex].find(d => d.date === date);
                return found ? found.vol : null;
            });

            return {
                label: ex,
                data: chartData,
                borderColor: colors[i],
                backgroundColor: colors[i],
                borderWidth: 2,
                tension: 0.4,
                pointRadius: 3,
                pointHoverRadius: 6,
                spanGaps: true // Connect points even if dates are missing
            };
        });

        new Chart(overloadCtx, {
            type: 'line',
            data: { 
                labels: sortedLabels,
                datasets: datasets 
            },
            options: { 
                responsive: true, 
                maintainAspectRatio: false,
                interaction: {
                    intersect: false,
                    mode: 'index',
                },
                scales: { 
                    y: { 
                        display: true,
                        grid: { color: '#111', drawBorder: false },
                        ticks: { 
                            color: '#555', 
                            font: { size: 10 },
                            callback: (val) => (val >= 1000 ? (val / 1000).toFixed(1) + 'k' : val)
                        }
                    }, 
                    x: { 
                        grid: { display: false }, 
                        ticks: { color: '#444', font: { size: 9 }, maxRotation: 45, minRotation: 45 } 
                    } 
                },
                plugins: { 
                    legend: { 
                        display: true, 
                        position: 'top',
                        align: 'start',
                        labels: {
                            color: '#888',
                            boxWidth: 10,
                            font: { size: 10 },
                            padding: 10
                        }
                    },
                    tooltip: {
                        backgroundColor: '#0a0a0a',
                        titleColor: '#00ff88',
                        bodyColor: '#fff',
                        borderColor: '#333',
                        borderWidth: 1,
                        padding: 10,
                        displayColors: true,
                        callbacks: {
                            label: (context) => ` ${context.dataset.label}: ${context.parsed.y.toLocaleString()} lbs`
                        }
                    }
                }
            }
        });

        // Nutrition Data
        if (data.nutrition && data.nutrition.length > 0) {
            const latest = data.nutrition[data.nutrition.length - 1];
            document.getElementById('nut-kcal').innerText = Math.round(latest.kcal);
            document.getElementById('nut-protein').innerText = Math.round(latest.protein) + 'g';
        }

        // Volume & Nutrition Trend
        const trendCtx = document.getElementById('volumeTrendChart').getContext('2d');
        const sortedDates = Object.keys(data.daily_vol).sort();

        // Filter out dates before 2026-01-01 or older than 30 days
        const filteredDates = sortedDates.filter(d => {
            const dateObj = new Date(d);
            const minDate = new Date();
            minDate.setDate(minDate.getDate() - 30); // Last 30 days
            return dateObj >= minDate;
        }).filter(d => d !== '2026-01-31'); // Exclude Jan 31st

        const proteinData = filteredDates.map(date => {
            const nutEntry = data.nutrition.find(n => n.date === date);
            return nutEntry ? nutEntry.protein : 0;
        });

        const volumeData = filteredDates.map(d => Object.values(data.daily_vol[d]).reduce((a,b)=>a+b, 0));

        new Chart(trendCtx, {
            type: 'bar', // Changed to bar for volume, line for protein
            data: {
                labels: filteredDates,
                datasets: [
                    {
                        type: 'bar',
                        label: 'Total Volume (lbs)',
                        data: volumeData,
                        backgroundColor: 'rgba(0, 255, 136, 0.6)', // Greenish for volume
                        yAxisID: 'y'
                    },
                    {
                        type: 'line',
                        label: 'Protein (g)',
                        data: proteinData,
                        borderColor: '#00ccff', // Bluish for protein
                        backgroundColor: 'rgba(0, 204, 255, 0.2)',
                        fill: true,
                        tension: 0.3,
                        yAxisID: 'y1'
                    }
                ]
            },
            options: { 
                responsive: true, 
                maintainAspectRatio: false,
                scales: { 
                    x: { 
                        grid: { display: false }, 
                        ticks: { color: '#444', font: { size: 9 }, maxRotation: 45, minRotation: 45 } 
                    },
                    y: { 
                        position: 'left',
                        grid: { color: '#111', drawBorder: false },
                        ticks: { color: '#555', font: { size: 10 } }
                    },
                    y1: { 
                        position: 'right',
                        grid: { drawOnChartArea: false }, // Only draw grid for y-axis
                        ticks: { color: '#555', font: { size: 10 } }
                    }
                },
                plugins: { 
                    legend: { 
                        display: true,
                        labels: { color: '#888' }
                    },
                    tooltip: {
                        backgroundColor: '#0a0a0a',
                        titleColor: '#00ff88',
                        bodyColor: '#fff',
                        borderColor: '#333',
                        borderWidth: 1,
                        padding: 10,
                        displayColors: true
                    }
                }
            }
        });
    </script>
