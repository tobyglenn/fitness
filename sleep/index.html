<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>😴 Sleep & Recovery</title>
  <style>
    :root { --bg:#0d1117; --card:#161b22; --line:#30363d; --text:#e6edf3; --muted:#8b949e; --accent:#8b5cf6; --link:#58a6ff; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif; background:var(--bg); color:var(--text); }
    .container { max-width:1100px; margin:0 auto; padding:24px 20px 40px; }
    h1 { margin:0 0 8px; font-size:2rem; }
    .subtitle { color:var(--muted); margin:0 0 22px; }
    .hero-card,.year-block { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:18px; }
    .hero-card h2,.year-block h2 { margin:0 0 12px; font-size:1.05rem; color:var(--accent); }
    .dashboard-link { display:inline-block; margin-top:10px; padding:10px 14px; border:1px solid var(--line); border-radius:10px; color:var(--text); text-decoration:none; background:#11161d; }
    .dashboard-link:hover,.page-link:hover { border-color:var(--accent); color:var(--accent); }
    .page-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px; }
    .page-link { display:block; padding:12px 14px; border:1px solid var(--line); border-radius:10px; text-decoration:none; color:var(--text); background:#11161d; }
    .empty-note { color:var(--muted); margin:0; }
  </style>
</head>
<body>
<nav id="site-nav" style="background:#1a1a2e;padding:10px 20px;text-align:center;font-size:14px;border-bottom:1px solid #333;display:flex;flex-wrap:wrap;justify-content:center;gap:8px 16px;">
  <a id="nav-hub" href="#" style="color:#a0aec0;text-decoration:none;">🏠 Hub</a>
  <a id="nav-calendars" href="#" style="color:#a0aec0;text-decoration:none;">📅 Calendars</a>
  <a id="nav-strength" href="#" style="color:#a0aec0;text-decoration:none;">💪 Strength</a>
  <a id="nav-running" href="#" style="color:#a0aec0;text-decoration:none;">🏃 Running</a>
  <a id="nav-sleep" href="#" style="color:#a0aec0;text-decoration:none;">😴 Sleep &amp; Recovery</a>
  <a id="nav-nutrition" href="#" style="color:#a0aec0;text-decoration:none;">🥗 Nutrition</a>
</nav>
<script>
(function(){
  var isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.hostname.startsWith('192.168.');
  var base = isLocal ? 'http://192.168.1.249:8080/' : 'https://tobyglenn.github.io/fitness/';
  var depth = (location.pathname.match(/\//g)||[]).length - 1;
  document.getElementById('nav-hub').href = base;
  document.getElementById('nav-calendars').href = base + 'calendars/';
  document.getElementById('nav-strength').href = base + 'strength/';
  document.getElementById('nav-running').href = base + 'running/';
  document.getElementById('nav-sleep').href = base + 'sleep/';
  document.getElementById('nav-nutrition').href = base + 'nutrition/';
})();
</script>
<div class="container">
  <h1>😴 Sleep & Recovery</h1>
  <p class="subtitle">Sleep dashboard and section sub-pages.</p>
  <section class="hero-card">
    <h2>Main dashboard</h2>
    <p>Primary sleep dashboard with recovery and sleep trends.</p>
    <a class="dashboard-link" href="index.html">Open this section dashboard</a>
  </section>
  <section class="year-block"><h2>Section pages</h2><div class="page-grid"><a class="page-link" href="consistency.html">Consistency</a></div></section>
</div>

<!-- morning_report_link_injected --><script>
(function(){
  document.querySelectorAll("td,li,.date-cell,.date").forEach(function(el){
    var t = el.textContent.trim();
    if (/^\d{4}-\d{2}-\d{2}$/.test(t) && !el.querySelector("a")) {
      el.innerHTML =
        '<a href="/fitness/morning_report_' + t + '.html" ' +
        'style="color:#58a6ff;text-decoration:none" title="Morning report">' + t + '</a>' +
        ' <a href="/fitness/nightly_report_' + t + '.html" ' +
        'style="color:#8b949e;text-decoration:none;font-size:0.85em" title="Nightly report">🌙</a>';
    }
  });
})();
</script>
</body>
</html>
