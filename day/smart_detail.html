_week": 0}}};
const AVG_NUTRITION = {"calories": 2416, "protein": 276.8, "carbs": 160.3, "fat": 77.2};
const TODAY = "2026-02-27";

const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

function getQueryDate() {
  const p = new URLSearchParams(window.location.search);
  return p.get("date") || TODAY;
}

function setQueryDate(d) {
  const url = new URL(window.location);
  url.searchParams.set("date", d);
  window.history.pushState({}, "", url);
}

let currentDate = getQueryDate();

function prevDay() {
  const d = new Date(currentDate + "T12:00:00");
  d.setDate(d.getDate() - 1);
  currentDate = d.toISOString().slice(0,10);
  setQueryDate(currentDate);
  render();
}

function nextDay() {
  const d = new Date(currentDate + "T12:00:00");
  d.setDate(d.getDate() + 1);
  currentDate = d.toISOString().slice(0,10);
  setQueryDate(currentDate);
  render();
}

function goToDate(v) {
  currentDate = v;
  setQueryDate(v);
  render();
}

function formatDate(s) {
  const d = new Date(s + "T12:00:00");
  return DAYS[d.getDay()] + ", " + MONTHS[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear();
}

function svgRing(pct, color, size=60) {
  const r = (size/2) - 6;
  const circ = 2 * Math.PI * r;
  const dash = (pct / 100) * circ;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#21262d" stroke-width="5"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="5"
      stroke-dasharray="${dash.toFixed(1)} ${(circ-dash).toFixed(1)}"
      stroke-dashoffset="${circ * 0.25}"
      stroke-linecap="round"/>
    <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" fill="white" font-size="${size*0.22}px" font-weight="700">${pct}%</text>
  </svg>`;
}

function scoreColor(score, thresholdGood=67, thresholdMed=40) {
  if (score >= thresholdGood) return "#2ea043";
  if (score >= thresholdMed) return "#f39c12";
  return "#f85149";
}

function macroBar(val, avg, color) {
  const pct = avg > 0 ? Math.min(100, (val / (avg * 1.5)) * 100) : 50;
  return `<div class="nutrition-bar"><div class="nutrition-fill" style="width:${pct}%;background:${color};"></div></div>`;
}

      </div>
    </div>
  </div>`;

  // ── Recovery Row ─────────────────────────────────────────────────────────

  // WHOOP
  if (whoop) {

    </div>`;
  } else {
    html += `<div class="card"><div class="card-title">WHOOP Recovery</div><div class="no-data">No WHOOP data</div></div>`;
  }

  // 8Sleep
  if (sleep) {
    const sleepPct = sleep.score || 0;
    const sleepCol = scoreColor(sleepPct, 80, 60);
    html += `<div class="card">

          ${w.reps ? `<div class="workout-stat"><strong>${w.reps}</strong> reps</div>` : ""}
          ${w.duration_min ? `<div class="workout-stat"><strong>${w.duration_min}</strong> min</div>` : ""}
        </div>`;

      if (w.exercises && w.exercises.length > 0) {
        html += `<div style="margin-top:12px;">`;
        for (const ex of w.exercises) {
          html += `<div class="tonal-exercise">

          </div>`;
        }

      }

    }
  }

    for (const act of garmin) {

    html += `<div class="card">

      <div class="macro-grid">

          ${avg.calories ? `<div class="macro-avg">avg: ${avg.calories}</div>` : ""}
          ${macroBar(nutrition.calories, avg.calories || 2000, "#f39c12")}
        </div>
        <div class="macro-card">
          <div class="macro-val" style="color:#0a84ff">${nutrition.protein}g</div>
          <div class="macro-lbl">Protein</div>
          ${avg.protein ? `<div class="macro-avg">avg: ${avg.protein}g</div>` : ""}
          ${macroBar(nutrition.protein, avg.protein || 150, "#0a84ff")}
        </div>
        <div class="macro-card">
          <div class="macro-val" style="color:#2ea043">${nutrition.carbs}g</div>
          <div class="macro-lbl">Carbs</div>
          ${avg.carbs ? `<div class="macro-avg">avg: ${avg.carbs}g</div>` : ""}
          ${macroBar(nutrition.carbs, avg.carbs || 200, "#2ea043")}
        </div>
        <div class="macro-card">
          <div class="macro-val" style="color:#da3633">${nutrition.fat}g</div>
          <div class="macro-lbl">Fat</div>
          ${avg.fat ? `<div class="macro-avg">avg: ${avg.fat}g</div>` : ""}
          ${macroBar(nutrition.fat, avg.fat || 80, "#da3633")}
        </div>
      </div>
    </div>`;
  } else {
    html += `<div class="card"><div class="no-data">No nutrition data logged for this day.</div></div>`;
  }
  html += `</div>`;

  // ── Quick Links ──────────────────────────────────────────────────────────
  const prevD = new Date(currentDate + "T12:00:00");
  prevD.setDate(prevD.getDate() - 1);
  const nextD = new Date(currentDate + "T12:00:00");
