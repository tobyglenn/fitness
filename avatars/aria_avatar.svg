<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#1e1e2e"/>
  
  <!-- Cherry blossom petals -->
  <g fill="#ff69b4" opacity="0.9">
    <!-- Center -->
    <circle cx="50" cy="50" r="6" fill="#ffb6c1"/>
    
    <!-- 5 petals -->
    <ellipse cx="50" cy="28" rx="10" ry="18"/>
    <ellipse cx="68" cy="42" rx="18" ry="10" transform="rotate(72 68 42)"/>
    <ellipse cx="60" cy="66" rx="18" ry="10" transform="rotate(144 60 66)"/>
    <ellipse cx="40" cy="66" rx="18" ry="10" transform="rotate(216 40 66)"/>
    <ellipse cx="32" cy="42" rx="18" ry="10" transform="rotate(288 32 42)"/>
  </g>
  
  <!-- Petal highlights -->
  <g fill="#ffc0cb" opacity="0.6">
    <ellipse cx="50" cy="32" rx="5" ry="10"/>
    <ellipse cx="64" cy="44" rx="10" ry="5" transform="rotate(72 64 44)"/>
    <ellipse cx="58" cy="62" rx="10" ry="5" transform="rotate(144 58 62)"/>
    <ellipse cx="42" cy="62" rx="10" ry="5" transform="rotate(216 42 62)"/>
    <ellipse cx="36" cy="44" rx="10" ry="5" transform="rotate(288 36 44)"/>
  </g>
  
  <!-- Subtle glow -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="#ff69b4" stroke-width="2" opacity="0.3"/>
</svg>